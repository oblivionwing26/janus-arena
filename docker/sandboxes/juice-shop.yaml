# How DockerSandbox runs OWASP Juice Shop, the security target (ADR 0006), on the janus-sbx
# network: the published image, unmodified, pinned by digest. It keeps its data in its own
# SQLite file, so nothing else is started.
name: juice-shop
image: bkimminich/juice-shop:v20.3.0@sha256:cea5a4af4aacee498c491491af0408934ec81d004035c0a02ef3e54395e3bf27

app:
  port: 3000
  # Distroless image without a healthcheck or a shell: ready once it logs this.
  readyLog: Server listening on port 3000

# Quiet mode (Juice Shop's own config/quiet.yml): no solved-challenge notifications, hints,
# hacking instructor or welcome banner. Juice Shop's ground truth must never reach an agent, and
# a persona that merely opens the privacy policy would otherwise see "challenge solved" (F3.5a).
# The challenges are still tracked server-side, for the orchestrator's own checks.
env:
  NODE_ENV: quiet

# Juice Shop serves this folder at /.well-known; the run's ownership token is copied there (F3.1).
verification:
  dir: /juice-shop/.well-known

# How the Blue Team's fixes run (F3.5, ADR 0012): this image plus the recompiled backend files of
# a patch to Juice Shop's source at the image's tag. The source reaches the agent without its
# ground truth: the challenge fixes are hidden and the lines marking vulnerable code removed.
patch:
  repo: https://github.com/juice-shop/juice-shop.git
  ref: v20.3.0
  dockerfile: juice-shop.patch.Dockerfile
  excludeFiles: [data/static/codefixes]
  stripComments: [vuln-code-snippet]
  # Backend sources only: compiled into build/ and copied over the image. Startup and the
  # challenge bookkeeping stay as published, since the orchestrator reads challenges as truth.
  blueTeam:
    allow: ['routes/**/*.ts', 'lib/**/*.ts', 'models/**/*.ts']
    deny: ['lib/startup/**', 'lib/challengeUtils.ts']
  # Juice Shop's own tests (V2), each file in its own process so its results carry its name.
  # No --test-force-exit: it ends a file before all its tests register, so counts vary by run.
  # Some assert Juice Shop's vulnerabilities: config/vulnerability-tests.yaml lists them.
  tests:
    files: ['test/api/*.test.ts', 'test/server/*.unit.test.ts']
    command:
      [node, --import, ./test/api/helpers/test-env.mjs, --import, tsx, --test, --test-reporter=tap]
