# How DockerSandbox builds and runs ShopLab (repo janus-shoplab) on the janus-sbx network.
name: shoplab
repo: https://github.com/oblivionwing26/janus-shoplab.git

# Ground truth that no agent may read (ADR 0006). Removed from every cloned workspace.
excludeFiles:
  - UX_FLAWS.md

# What the UI Engineer may edit (F2.3): pages, styles and components. Never the API, the
# business and auth code in src/lib, manifests, lockfiles or the ground truth.
uiEngineer:
  allow:
    - src/app/**/page.tsx
    - src/app/**/*.css
    - src/components/**
  deny:
    - src/app/api/**

build:
  setupTarget: tools
  appTarget: runner

# ShopLab's own checks, run on every patch an agent proposes (F2.3), with no network.
checks:
  target: tools
  command: [sh, -c, 'pnpm lint && pnpm typecheck && pnpm test']

database:
  image: postgres:17-alpine
  user: shoplab
  password: shoplab
  name: shoplab

# Runs once in the setup image against the variant's database: migrations, then synthetic seed.
setup:
  command: [sh, -c, 'pnpm db:migrate && pnpm db:seed']

app:
  port: 3100
  healthPath: /api/health

# The ownership token (F3.1, F4.1, ADR 0020): Janus copies it here and ShopLab serves it at
# /.well-known/janus-verify.txt (SHOPLAB_VERIFY_FILE below), as Juice Shop does from its own folder.
# The folder is made by ShopLab's Dockerfile; the docker cp guard only accepts a .well-known path.
verification:
  dir: /app/.well-known
env:
  SHOPLAB_VERIFY_FILE: /app/.well-known/janus-verify.txt

# What a run may switch on in a variant (F4.1, F4.2): ShopLab's defenses and nothing else.
variantEnv:
  - SHOPLAB_RATE_LIMIT_IP
  - SHOPLAB_RATE_LIMIT_ACCOUNT
  - SHOPLAB_STEP_UP_CHECKOUT
  - SHOPLAB_STEP_UP_ACCOUNT_AGE_SECONDS
  - SHOPLAB_TRUST_FORWARDED_FOR
