# LLM roles and prices (ADR 0004). Code names a role, never a model, and never a price.
# Edit this file to swap a model or update prices; no code change is needed.

# Prices below are in USD; budgets are in EUR. Update the rate by hand.
usdToEur: 0.86

roles:
  navigator:
    model: claude-haiku-5-5
    maxTokens: 4096
    effort: low
  competent-baseline:
    model: claude-sonnet-5-5
    maxTokens: 8192
  ui-engineer:
    model: claude-sonnet-5-5
    maxTokens: 16000
  red-team:
    model: claude-sonnet-5-5
    maxTokens: 16000
  blue-team:
    model: claude-sonnet-5-5
    maxTokens: 16000
  architect:
    model: claude-opus-5-5
    maxTokens: 16000

# USD per million tokens, Anthropic first-party API. Check the pricing page before relying on them.
# cacheWrite is the 5-minute TTL write price (1.25x input).
# Haiku 5.5 prices apply to prompts up to 100K tokens; longer prompts are billed higher and
# are not modelled here (navigator observations stay far below that).
prices:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cacheRead: 0.01
    cacheWrite: 0.125
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cacheRead: 0.20
    cacheWrite: 2.50
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cacheRead: 0.20
    cacheWrite: 5.00
