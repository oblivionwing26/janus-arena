# How Janus reads each target's HTTP surface (F2.6): which framework declares its routes, and
# for Express, the files that register them. The map is read from the code; nothing runs.

targets:
  shoplab:
    framework: nextjs
    # Throws unless the request has a session; returns the session's user.
    authCalls: [requireUser]

  # OWASP Juice Shop, the security target (ADR 0006), pinned to the release Janus is tested on.
  juice-shop:
    repo: https://github.com/juice-shop/juice-shop.git
    ref: v20.3.0
    framework: express
    files: [server.ts]
    authMiddleware:
      [security.isAuthorized, security.isAccounting, security.denyAll, security.isDeluxe]
    sessionCalls: [security.authenticatedUsers.from, security.authenticatedUsers.get]
    # security.appendUserId() copies the session user's id into the body.
    sessionIds: [req.body.UserId]
    # Marks challenges as solved; it reads the user but controls no access.
    ignoreCalls: [challengeUtils.solveIf, challengeUtils.solve]
