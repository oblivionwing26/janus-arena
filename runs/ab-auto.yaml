# F2.4 "Done when": one command produces the A/B report with a generated variant B.
#   pnpm run:ab-auto runs/ab-auto.yaml            (needs pnpm dev running)
# Only variant A is declared: B is generated by the UI Engineer from the friction SynthLab
# finds on A. Every persona plays the coupon task, the path that crosses ShopLab's three
# seeded flaws (F1.10). Discovery: 8 personas + baseline; A/B: twice that.

target: shoplab
variants:
  - { id: a, ref: main }
personas:
  [
    carmen-retired,
    diego-commuter,
    javier-budget,
    lucia-private,
    marta-first-phone,
    pablo-student,
    rosa-meticulous,
    tomas-hurried,
  ]
seeds: [1]
tasks:
  - id: use-coupon
    goal: Buy one "Set de acuarelas (12 colores)" using your discount coupon BIENVENIDA10.
    expect:
      items: [{ product: Set de acuarelas (12 colores), quantity: 1 }]
      discounted: true
budget:
  maxTokens: 4000000
  maxEur: 0.8
concurrency: 3
