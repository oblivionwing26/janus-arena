# F3.6: shoppers on OWASP Juice Shop with Inés, who tries five old passwords before the right one,
# to measure what a login protection costs honest shoppers. Carmen and Rosa reach the purchase
# on Juice Shop (F3.5a); Tomás and Diego's patience never does, so they would only add noise.
# 3 personas x 2 seeds plus the competent baseline on each seed = 8 sessions per variant.
#   pnpm run:start runs/juice-shop-login.yaml
#   pnpm run:blue-team <poc.json> --run-file runs/juice-shop-login.yaml

target: juice-shop
variants:
  - { id: a, ref: image }
personas: [ines-forgetful, carmen-retired, rosa-meticulous]
seeds: [1, 2]
tasks:
  - id: buy-apple-juice
    goal: Sign in to your account, then buy one "Apple Juice (1000ml)" and have it delivered to your home address.
    expect:
      items: [{ product: Apple Juice (1000ml), quantity: 1 }]
maxSteps: 70
budget:
  maxTokens: 5000000
  maxEur: 1
concurrency: 3
